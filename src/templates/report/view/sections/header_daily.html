
        <!-- ==========================================================
             Header - Daily layout
             ========================================================== -->
        <header class="report-header-v3">
            <div class="report-header-center report-header-banner report-header-banner-html">
                <div class="report-header-overlay report-header-overlay-html">
                    <div class="report-header-column-left-html">
                        <img src="{{ meta.html_header_left_background_uri or meta.html_header_background_uri or meta.header_background_uri }}" alt="" class="report-header-left-background-html" aria-hidden="true">
                    </div>

                    <div class="report-header-column-right-html">
                        <img src="{{ meta.html_header_right_background_uri or meta.html_header_background_uri or meta.header_background_uri }}" alt="" class="report-header-right-background-html" aria-hidden="true">
                        <div class="report-banner-copy report-banner-copy-html">
                            <h1 class="report-main-title">ENERGY REPORT</h1>
                            <p class="report-hero-subtitle">Daily automatic report • Energy performance overview</p>
                            <div class="report-meta-line">
                                <span class="report-meta-line-icon">
                                    {% include "assets/icon/calendar.svg" %}
                                </span>
                                <span class="report-meta-line-label">Created:</span>
                                <span class="report-meta-line-value">{{ generated_at }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="report-header-divider"></div>
