<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.report_title or "Energy Consumption Report" }}</title>

    <style>
        {% include "assets/report_pdf_base.css" %}
    </style>
    <script>
        {% include "assets/vendor/echarts/echarts.min.js" %}
    </script>
    <script>
        window.status = "loading";
        window.__pdfReadyDelayMs = 5000;

        window.__scheduleReportChartInit = function (initFn) {
            let attempts = 0;
            const maxAttempts = 24;

            function finalize() {
                window.setTimeout(function () {
                    window.dispatchEvent(new Event("resize"));
                }, 140);
                window.setTimeout(function () {
                    window.dispatchEvent(new Event("beforeprint"));
                }, 380);
            }

            function run() {
                attempts += 1;
                const ready = initFn(attempts);
                if (ready === false && attempts < maxAttempts) {
                    window.setTimeout(run, 160);
                    return;
                }
                finalize();
            }

            function schedule() {
                window.setTimeout(run, 100);
            }

            if (document.readyState === "loading") {
                window.addEventListener("load", schedule, { once: true });
            } else {
                schedule();
            }
        };

        window.addEventListener("load", function () {
            window.setTimeout(function () {
                window.status = "ready";
            }, window.__pdfReadyDelayMs);
        }, { once: true });
    </script>
    <script>
        window.__freezeReportCharts = function (sectionName, charts, chartTargets) {
            return new Promise(function (resolve) {
                window.requestAnimationFrame(function () {
                    window.requestAnimationFrame(function () {
                        charts.forEach(function (chart, index) {
                            const target = chartTargets[index];
                            if (!chart || !target) {
                                return;
                            }

                            let frozenMarkup = "";
                            if (typeof chart.renderToSVGString === "function") {
                                frozenMarkup = chart.renderToSVGString();
                            }

                            let dataUrl = "";
                            if (!frozenMarkup && typeof chart.getDataURL === "function") {
                                dataUrl = chart.getDataURL({
                                    type: "png",
                                    pixelRatio: 2,
                                    excludeComponents: ["toolbox"],
                                }) || "";
                            }

                            if (typeof chart.dispose === "function") {
                                chart.dispose();
                            }

                            target.innerHTML = "";
                            if (frozenMarkup) {
                                target.innerHTML = frozenMarkup;
                                const svg = target.querySelector("svg");
                                if (svg) {
                                    svg.classList.add("report-chart-print-svg");
                                }
                                return;
                            }

                            if (dataUrl) {
                                const img = document.createElement("img");
                                img.src = dataUrl;
                                img.alt = "";
                                img.className = "report-chart-print-image";
                                target.appendChild(img);
                            }
                        });
                        resolve();
                    });
                });
            });
        };
    </script>
    <style>
        {% include "assets/report_pdf.css" %}
    </style>
    {% if report_style_css %}
    <style>
        {{ report_style_css | safe }}
    </style>
    {% endif %}
    <script>
        (function () {
            if (!window.echarts) {
                return;
            }

            var reportChartThemeName = {{ (chart_theme_name or 'report_default') | tojson }};
            var reportChartTheme = {{ (chart_theme_json or '{}') | safe }};
            echarts.registerTheme(reportChartThemeName, reportChartTheme);
            window.REPORT_CHART_THEME_NAME = reportChartThemeName;
        })();
    </script>
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm 8mm;
        }

        @page landscape-page {
            size: A4 landscape;
            margin: 8mm;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        body {
            font-size: 10.5px;
            line-height: 1.35;
            color: #0f172a;
        }

        .pdf-header-print-only {
            display: none !important;
        }

        .pdf-header-screen-only {
            display: block !important;
        }

        .pdf-preview-header-shell {
            border-left-width: 0;
            background: #ffffff;
        }

        .pdf-preview-header-grid {
            min-height: 132px;
            display: grid;
            grid-template-columns: 236px minmax(0, 1fr);
            align-items: stretch;
            gap: 0;
        }

        .pdf-preview-header-left,
        .pdf-preview-header-right {
            position: relative;
            min-height: 132px;
            overflow: hidden;
        }

        .pdf-preview-header-left {
            background: #ffffff;
        }

        .pdf-preview-header-right {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 44px 0 0;
            background: #ffffff;
        }

        .pdf-preview-header-left-image,
        .pdf-preview-header-right-image {
            position: absolute;
            top: 50%;
            height: 100%;
            width: auto;
            max-width: none;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .pdf-preview-header-left-image {
            left: 0;
        }

        .pdf-preview-header-right-image {
            right: 0;
        }

        .pdf-preview-header-copy {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 7px;
            min-width: 0;
            max-width: 540px;
        }

        .pdf-preview-header-copy .report-main-title {
            color: #0b3554;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .pdf-preview-header-copy .report-hero-subtitle {
            color: #284b63;
            line-height: 1.24;
        }

        .pdf-preview-header-copy .report-meta-line {
            gap: 6px;
            color: #3f5f77;
        }

        .pdf-preview-header-copy .report-meta-line-label {
            color: #0f3554;
        }

        .pdf-preview-header-copy .report-meta-line-value,
        .pdf-preview-header-copy .report-meta-line-icon {
            color: #005496;
        }

        @media screen {
            html {
                background: #dbe3ea;
            }

            body {
                width: auto;
                min-width: 0;
                min-height: 100vh;
                margin: 0;
                padding: 20px 0 32px;
                box-sizing: border-box;
                background: transparent;
                box-shadow: none;
            }

            body.pdf-screen-paginated .report-container {
                display: flex;
                flex-direction: column;
                gap: 18px;
                align-items: center;
                background: transparent;
            }

            .pdf-preview-page {
                width: 210mm;
                min-height: 297mm;
                height: 297mm;
                background: #ffffff;
                box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
                border-radius: 6px;
                overflow: hidden;
            }

            .pdf-preview-page.is-landscape {
                width: 297mm;
                min-height: 210mm;
                height: 210mm;
            }

            .pdf-preview-page-inner {
                width: 100%;
                height: 100%;
                padding: 10mm 8mm;
                box-sizing: border-box;
                overflow: hidden;
                background: #ffffff;
            }

            .pdf-preview-page.is-landscape .pdf-preview-page-inner {
                padding: 8mm;
            }
        }

        @media print {
            .pdf-header-print-only {
                display: none !important;
            }

            .pdf-header-screen-only {
                display: block !important;
            }

            .pdf-preview-page,
            .pdf-preview-page-inner {
                width: auto !important;
                min-height: 0 !important;
                height: auto !important;
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                overflow: visible !important;
                background: transparent !important;
            }
        }

        .report-container {
            max-width: none;
            margin: 0;
            padding: 0;
            background: #ffffff;
            border-radius: 0;
            box-shadow: none;
        }

        .report-header-top,
        .report-header-v3,
        .report-header-divider,
        .period-strip-v1,
        .section-header,
        .electricity-subsection-title {
            break-after: avoid;
            page-break-after: avoid;
        }

        .report-header-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #cbd5e1, transparent);
            margin: 12px 0 14px;
        }

        .period-strip-v1 {
            margin-bottom: 18px;
        }

        .period-strip-table {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #dbeafe;
            background: #ffffff;
        }

        .period-strip-cell {
            background: #ffffff;
        }

        .period-strip-cell:nth-child(odd) {
            background: #f8fbff;
        }

        .report-section {
            margin-bottom: 12px;
            padding-top: 0;
            break-inside: auto !important;
            page-break-inside: auto !important;
        }

        .report-table-wrap,
        .surface-table-wrap,
        .electricity-total-card,
        .kpi-plant-card {
            box-shadow: none !important;
        }

        .report-table-wrap,
        .surface-table-wrap {
            overflow: visible !important;
            max-height: none !important;
            border-radius: 8px;
        }

        .report-table-ui,
        .surface-table,
        .period-strip-table {
            width: 100%;
            table-layout: fixed;
        }

        .report-table-ui thead,
        .surface-table thead {
            display: table-header-group;
        }

        .report-table-ui tfoot,
        .surface-table tfoot {
            display: table-footer-group;
        }

        .report-table-ui th,
        .report-table-ui td,
        .surface-table th,
        .surface-table td {
            padding: 5px 6px !important;
            font-size: 9px !important;
            line-height: 1.25;
            white-space: normal;
            word-break: break-word;
        }

        .report-table-ui thead th,
        .surface-table thead th {
            position: static !important;
            top: auto !important;
            left: auto !important;
            z-index: auto !important;
            font-size: 8.5px !important;
            background: #f8fafc !important;
            box-shadow: none !important;
        }

        .sticky-date-col,
        .sticky-rank,
        .sticky-meter {
            position: static !important;
            left: auto !important;
            background: inherit !important;
        }

        .kpi-total-grid {

            margin-bottom: 10px;
        }

            align-items: flex-end;
            gap: 1px;
        }

        .daily-highlight-header .section-header {
            background: linear-gradient(180deg, #eef5ff 0%, #f7fbff 100%);
            border: 1px solid #c9dcff;
            border-left: 5px solid #005496;
            border-radius: 12px;
            padding: 10px 14px 8px;
            box-shadow: none;

        .daily-highlight-header .section-subtitle {

        }

            margin-left: 0;
        }

        .electricity-total-card,
        .kpi-plant-card {

            border-radius: 8px;
        }

        .electricity-total-card-title,
        .kpi-plant-card-title,
        .electricity-subsection-title {

        }

        .electricity-total-value,
        .kpi-plant-value {
            font-size: 13.5px;
        }

        .electricity-total-label,
        .kpi-plant-label {

        }

        .electricity-total-ratio {
            display: block;
            font-size: 8px;
            font-weight: 600;
            line-height: 1.05;
            color: #6b7280;
        }

        .electricity-total-ratio .electricity-inline-ratio {
            margin-left: 0;
        }

        .section-header {
            margin-bottom: 10px;
            padding-bottom: 6px;
        }

        .section-header h2 {
            font-size: 16px;
        }

        .section-subtitle {

        }

        .status-pill {
            min-width: 58px;
            padding: 2px 6px;
            font-size: 8px;
        }

        .value,
        .electricity-inline-ratio,
        .electricity-inline-ratio-table,

            white-space: nowrap;
        }

        .electricity-inline-ratio,
        .electricity-inline-ratio-table,
        .pct {
            font-size: 7px !important;
            margin-left: 2px !important;

        .electricity-comparison-table .col-current,
        .electricity-comparison-table .col-previous,
        .electricity-top10-table .col-current,
        .electricity-top10-table .col-previous,
        .electricity-daily-summary-table .col-top1-value,
        .electricity-daily-summary-table .col-total-energy,
        .electricity-daily-summary-table .col-avg-active {
            white-space: nowrap;
        }

        .electricity-top10-table,
        .electricity-daily-summary-table,
        .electricity-daily-detail-table,
        .utility-total-table,
        .utility-detail-table,
        .kpi-area-table,
        .kpi-product-table,
        .kpi-daily-detail-table {
            min-width: 0 !important;
        }

        .electricity-daily-detail-table td,
        .utility-detail-table td,
        .kpi-daily-detail-table td {
            text-align: center;
        }

        .electricity-daily-detail-table th,
        .electricity-daily-detail-table td {
            white-space: nowrap;
        }

        .electricity-daily-detail-table .col-date,
        .utility-detail-table .col-date,
        .kpi-daily-detail-table td:first-child {
            text-align: left;
        }

        .pdf-section-opening,
        .pdf-keep-together,
        .utility-total-block,
        .kpi-total-block,
        .kpi-product-block,
        .electricity-detail-block,
        .electricity-daily-summary-block {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .pdf-landscape-block {
            page: landscape-page;
            break-before: page;
            page-break-before: always;
        }

        .pdf-landscape-block .report-table-ui th,
        .pdf-landscape-block .report-table-ui td {
            padding: 4px 5px !important;
            font-size: 8px !important;
        }

        .pdf-landscape-block .section-header,
        .pdf-landscape-block .electricity-subsection-title {
            break-after: avoid;
            page-break-after: avoid;
        }

        .pdf-landscape-block .col-date {
            min-width: 78px !important;
        }

        .kpi-daily-detail-table .col-date {
            width: 112px !important;
            min-width: 112px !important;
            white-space: nowrap;
        }

        .electricity-daily-detail-block,
        .electricity-daily-detail-table-block,
        .utility-detail-block,
        .kpi-daily-detail-block {
            break-inside: auto;
            page-break-inside: auto;
        }

    </style>
    <script>
        (function () {
            function isScreenPreviewMode() {
                return typeof window !== "undefined"
                    && typeof window.matchMedia === "function"
                    && window.matchMedia("screen").matches
                    && !window.matchMedia("print").matches;
            }

            function collectContentNodes(container) {
                return Array.from(container.childNodes).filter(function (node) {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        return true;
                    }
                    return node.nodeType === Node.TEXT_NODE && node.textContent.trim();
                });
            }

            function unwrapPaginatedPreview(container) {
                var pages = Array.from(container.querySelectorAll(":scope > .pdf-preview-page"));
                if (!pages.length) {
                    return;
                }

                var fragment = document.createDocumentFragment();
                pages.forEach(function (page) {
                    var inner = page.querySelector(":scope > .pdf-preview-page-inner");
                    if (!inner) {
                        return;
                    }
                    while (inner.firstChild) {
                        fragment.appendChild(inner.firstChild);
                    }
                });

                container.innerHTML = "";
                container.appendChild(fragment);
            }

            function createPreviewPage(isLandscape) {
                var page = document.createElement("div");
                page.className = "pdf-preview-page" + (isLandscape ? " is-landscape" : "");

                var inner = document.createElement("div");
                inner.className = "pdf-preview-page-inner";
                page.appendChild(inner);

                return { page: page, inner: inner };
            }

            function paginatePreview() {
                if (!isScreenPreviewMode()) {
                    return;
                }

                var container = document.querySelector(".report-container");
                if (!container) {
                    return;
                }

                unwrapPaginatedPreview(container);
                var items = collectContentNodes(container);
                if (!items.length) {
                    return;
                }

                container.innerHTML = "";
                document.body.classList.add("pdf-screen-paginated");

                var current = null;

                function openPage(isLandscape) {
                    current = createPreviewPage(isLandscape);
                    container.appendChild(current.page);
                }

                function ensurePage(isLandscape, forceBreak) {
                    if (!current || forceBreak || (current.page.classList.contains("is-landscape") !== isLandscape)) {
                        openPage(isLandscape);
                    }
                }

                function fitsCurrentPage() {
                    return current && current.inner.scrollHeight <= current.inner.clientHeight;
                }

                function appendAtomicNode(node) {
                    var isElement = node.nodeType === Node.ELEMENT_NODE;
                    var forceBreak = isElement && node.classList.contains("page-break-before");
                    var isLandscape = isElement && node.classList.contains("pdf-landscape-block");

                    ensurePage(isLandscape, forceBreak);
                    current.inner.appendChild(node);

                    if (!fitsCurrentPage() && current.inner.childNodes.length > 1) {
                        current.inner.removeChild(node);
                        openPage(isLandscape);
                        current.inner.appendChild(node);
                    }
                }

                function createSectionClone(section) {
                    return section.cloneNode(false);
                }

                function appendSectionNode(section) {
                    var children = collectContentNodes(section);
                    if (!children.length) {
                        appendAtomicNode(section);
                        return;
                    }

                    var sectionClone = null;

                    function ensureSectionClone() {
                        if (!sectionClone || sectionClone.parentNode !== current.inner) {
                            sectionClone = createSectionClone(section);
                            current.inner.appendChild(sectionClone);
                        }
                    }

                    children.forEach(function (child) {
                        var isElement = child.nodeType === Node.ELEMENT_NODE;
                        var forceBreak = isElement && child.classList.contains("page-break-before");
                        var isLandscape = isElement && child.classList.contains("pdf-landscape-block");

                        if (isLandscape) {
                            if (sectionClone && !sectionClone.childNodes.length) {
                                sectionClone.remove();
                            }
                            sectionClone = null;
                            appendAtomicNode(child);
                            return;
                        }

                        ensurePage(false, forceBreak);
                        ensureSectionClone();
                        sectionClone.appendChild(child);

                        if (!fitsCurrentPage() && sectionClone.childNodes.length > 1) {
                            sectionClone.removeChild(child);
                            openPage(false);
                            sectionClone = createSectionClone(section);
                            current.inner.appendChild(sectionClone);
                            sectionClone.appendChild(child);
                        }
                    });
                }

                items.forEach(function (item) {
                    var isElement = item.nodeType === Node.ELEMENT_NODE;
                    if (isElement && item.classList.contains("report-section")) {
                        appendSectionNode(item);
                        return;
                    }
                    appendAtomicNode(item);
                });
            }

            function schedulePagination() {
                if (!isScreenPreviewMode()) {
                    return;
                }

                window.setTimeout(paginatePreview, 120);
                window.setTimeout(paginatePreview, 900);
                window.setTimeout(paginatePreview, 2200);
            }

            document.addEventListener("DOMContentLoaded", schedulePagination, { once: true });
            window.addEventListener("load", schedulePagination, { once: true });
            window.addEventListener("resize", function () {
                if (!isScreenPreviewMode()) {
                    return;
                }
                window.clearTimeout(window.__pdfPreviewPaginateTimer);
                window.__pdfPreviewPaginateTimer = window.setTimeout(paginatePreview, 180);
            });
            window.addEventListener("beforeprint", function () {
                var container = document.querySelector(".report-container");
                if (!container) {
                    return;
                }
                unwrapPaginatedPreview(container);
                document.body.classList.remove("pdf-screen-paginated");
            });
        })();
    </script>
</head>
{% set report_scope = 'daily' if period.type == 'daily' else 'periodic' %}
<body class="pdf-render-mode report-body report-family-{{ report_scope }} report-period-{{ period.type | default('unknown') }}">
    <div class="report-container report-container-{{ report_scope }}">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
