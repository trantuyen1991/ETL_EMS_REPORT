<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.report_title or "Energy Consumption Report" }}</title>

    <style>
        {% include "assets/vendor/bootstrap/bootstrap.min.css" %}
    </style>
    <style>
        {% include "assets/report.css" %}
    </style>
    {% if report_style_css %}
    <style>
        {{ report_style_css | safe }}
    </style>
    {% endif %}
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
    <script>
        if (!window.echarts) {
            {% include "assets/vendor/echarts/echarts.min.js" %}
        }
    </script>
    <script>
        (function () {
            if (!window.echarts) {
                return;
            }

            var reportChartThemeName = {{ (chart_theme_name or 'report_default') | tojson }};
            var reportChartTheme = {{ (chart_theme_json or '{}') | safe }};
            echarts.registerTheme(reportChartThemeName, reportChartTheme);
            window.REPORT_CHART_THEME_NAME = reportChartThemeName;
        })();
    </script>
    <script>
        window.__scheduleReportChartInit = function (initFn) {
            let attempts = 0;
            const maxAttempts = 18;

            function finalize() {
                window.setTimeout(function () {
                    window.dispatchEvent(new Event("resize"));
                }, 120);
                window.setTimeout(function () {
                    window.dispatchEvent(new Event("beforeprint"));
                }, 320);
            }

            function run() {
                attempts += 1;
                const ready = initFn();
                if (ready === false && attempts < maxAttempts) {
                    window.setTimeout(run, 140);
                    return;
                }
                finalize();
            }

            function schedule() {
                window.requestAnimationFrame(function () {
                    window.requestAnimationFrame(run);
                });
            }

            if (document.readyState === "loading") {
                window.addEventListener("load", schedule, { once: true });
            } else {
                schedule();
            }
        };

        window.__enhanceReportLineChartOption = function (option, context) {
            const chartContext = context || {};
            if (!option || typeof option !== "object") {
                return option;
            }

            const enhancedOption = JSON.parse(JSON.stringify(option));
            const seriesList = Array.isArray(enhancedOption.series) ? enhancedOption.series : (enhancedOption.series ? [enhancedOption.series] : []);
            const hasLineSeries = seriesList.some(function (series) {
                return series && String(series.type || "").toLowerCase() === "line";
            });
            if (!enhancedOption.xAxis) {
                return enhancedOption;
            }

            function resolvePointValue(point) {
                if (point === null || point === undefined) {
                    return null;
                }
                const rawValue = point && typeof point === "object" && point.value !== undefined ? point.value : point;
                const value = Array.isArray(rawValue) ? rawValue[rawValue.length - 1] : rawValue;
                const numericValue = Number(value);
                return Number.isFinite(numericValue) ? numericValue : null;
            }

            function formatReportNumber(value) {
                const numericValue = Number(value);
                if (!Number.isFinite(numericValue)) {
                    return "-";
                }
                return numericValue.toLocaleString("en-US", {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2,
                });
            }

            function formatReportDelta(value) {
                const numericValue = Number(value);
                if (!Number.isFinite(numericValue)) {
                    return "-";
                }
                const sign = numericValue > 0 ? "+" : "";
                return sign + formatReportNumber(numericValue);
            }

            function formatReportPercent(value) {
                const numericValue = Number(value);
                if (!Number.isFinite(numericValue)) {
                    return "-";
                }
                const sign = numericValue > 0 ? "+" : "";
                return sign + (numericValue * 100).toLocaleString("en-US", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2,
                }) + "%";
            }

            function formatReportSharePercent(value) {
                const numericValue = Number(value);
                if (!Number.isFinite(numericValue)) {
                    return "-";
                }
                return (numericValue * 100).toLocaleString("en-US", {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 1,
                }) + "%";
            }

            function escapeReportHtml(value) {
                return String(value === null || value === undefined ? "" : value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function applyElectricityDeltaTooltip(formatterName) {
                const tooltip = enhancedOption.tooltip;
                if (!tooltip || tooltip.reportFormatter !== formatterName) {
                    return;
                }

                const valueUnit = String(tooltip.valueUnit || "kWh").trim();
                enhancedOption.tooltip = Object.assign({}, tooltip, {
                    formatter: function (params) {
                        const rows = Array.isArray(params) ? params : [params];
                        const axisLabel = rows[0] && (rows[0].axisValueLabel || rows[0].axisValue || rows[0].name);
                        const currentRow = rows[0] || {};
                        const previousRow = rows[1] || {};
                        const currentValue = resolvePointValue(currentRow.data !== undefined ? currentRow.data : currentRow.value);
                        const previousValue = resolvePointValue(previousRow.data !== undefined ? previousRow.data : previousRow.value);
                        const deltaValue = currentValue !== null && previousValue !== null ? currentValue - previousValue : null;
                        const deltaPct = deltaValue !== null && previousValue ? deltaValue / previousValue : null;
                        const unitSuffix = valueUnit ? " " + escapeReportHtml(valueUnit) : "";
                        const lines = [
                            "<div>" + escapeReportHtml(axisLabel || "") + "</div>",
                        ];

                        rows.forEach(function (row) {
                            if (!row) {
                                return;
                            }
                            const rowValue = resolvePointValue(row.data !== undefined ? row.data : row.value);
                            const marker = row.marker || "";
                            lines.push(
                                "<div>" + marker +
                                escapeReportHtml(row.seriesName || "") +
                                ": <strong>" + escapeReportHtml(formatReportNumber(rowValue)) + unitSuffix + "</strong></div>"
                            );
                        });

                        lines.push(
                            "<div style=\"margin-top:6px;border-top:1px solid rgba(148,163,184,0.35);padding-top:6px;\">" +
                            "Delta: <strong>" + escapeReportHtml(formatReportDelta(deltaValue)) + unitSuffix + "</strong></div>"
                        );
                        lines.push(
                            "<div>Delta %: <strong>" + escapeReportHtml(formatReportPercent(deltaPct)) + "</strong></div>"
                        );
                        return lines.join("");
                    },
                });
            }

            function applyElectricityPeriodAreaDeltaTooltip() {
                const tooltip = enhancedOption.tooltip;
                if (!tooltip || tooltip.reportFormatter !== "electricityPeriodAreaDelta") {
                    return;
                }

                const valueUnit = String(tooltip.valueUnit || "kWh").trim();
                enhancedOption.tooltip = Object.assign({}, tooltip, {
                    formatter: function (params) {
                        const rows = Array.isArray(params) ? params : [params];
                        const row = rows[0] || {};
                        const data = row.data && typeof row.data === "object" ? row.data : {};
                        const customData = data.customData && typeof data.customData === "object" ? data.customData : {};
                        const axisLabel = row.axisValueLabel || row.axisValue || row.name || data.name || "";
                        const deltaValue = customData.delta !== undefined ? customData.delta : resolvePointValue(data.value !== undefined ? data.value : row.value);
                        const deltaPct = customData.deltaPct !== undefined ? customData.deltaPct : null;
                        const currentValue = customData.current !== undefined ? customData.current : null;
                        const previousValue = customData.previous !== undefined ? customData.previous : null;
                        const unitSuffix = valueUnit ? " " + escapeReportHtml(valueUnit) : "";
                        const lines = [
                            "<div>" + escapeReportHtml(axisLabel || "") + "</div>",
                            "<div>" + (row.marker || "") +
                            "Delta: <strong>" + escapeReportHtml(formatReportDelta(deltaValue)) + unitSuffix + "</strong></div>",
                            "<div>Delta %: <strong>" + escapeReportHtml(formatReportPercent(deltaPct)) + "</strong></div>",
                        ];

                        if (currentValue !== null || previousValue !== null) {
                            lines.push("<div style=\"margin-top:6px;border-top:1px solid rgba(148,163,184,0.35);padding-top:6px;\">");
                            lines.push("Current: <strong>" + escapeReportHtml(formatReportNumber(currentValue)) + unitSuffix + "</strong></div>");
                            lines.push("<div>Previous: <strong>" + escapeReportHtml(formatReportNumber(previousValue)) + unitSuffix + "</strong></div>");
                        }

                        return lines.join("");
                    },
                });
            }

            function applyElectricityDailyTotalHeatmapTooltipAndZoom() {
                const tooltip = enhancedOption.tooltip;
                if (!tooltip || tooltip.reportFormatter !== "electricityDailyTotalHeatmap") {
                    return;
                }

                const valueUnit = String(tooltip.valueUnit || "kWh").trim();
                enhancedOption.tooltip = Object.assign({}, tooltip, {
                    formatter: function (params) {
                        const row = Array.isArray(params) ? (params[0] || {}) : (params || {});
                        const data = row.data && typeof row.data === "object" ? row.data : {};
                        const customData = data.customData && typeof data.customData === "object" ? data.customData : {};
                        const value = customData.value !== undefined ? customData.value : resolvePointValue(data.value !== undefined ? data.value : row.value);
                        const unitSuffix = valueUnit ? " " + escapeReportHtml(valueUnit) : "";
                        const marker = row.marker || "";
                        const categoryLabel = customData.category || row.name || customData.columnLabel || "";
                        const areaLabel = customData.area || row.seriesName || "";
                        const periodMaxValue = customData.periodMaxValue !== undefined ? customData.periodMaxValue : null;
                        const periodMaxLabel = customData.periodMaxCategory || "Period MAX";
                        const percentOfPeriodMax = customData.percentOfPeriodMax !== undefined ? customData.percentOfPeriodMax : null;

                        return [
                            "<div><strong>" + escapeReportHtml(categoryLabel) + "</strong></div>",
                            "<div>Area: <strong>" + escapeReportHtml(areaLabel) + "</strong></div>",
                            "<div>" + marker + "Total: <strong>" + escapeReportHtml(formatReportNumber(value)) + unitSuffix + "</strong></div>",
                            "<div style=\"margin-top:6px;border-top:1px solid rgba(148,163,184,0.35);padding-top:6px;\">Period MAX: <strong>" +
                            escapeReportHtml(formatReportNumber(periodMaxValue)) + unitSuffix + "</strong></div>",
                            "<div>MAX date: <strong>" + escapeReportHtml(periodMaxLabel) + "</strong></div>",
                            "<div>% of MAX: <strong>" + escapeReportHtml(formatReportSharePercent(percentOfPeriodMax)) + "</strong></div>",
                        ].join("");
                    },
                });

                const xAxisList = Array.isArray(enhancedOption.xAxis) ? enhancedOption.xAxis : [enhancedOption.xAxis];
                const xAxisIndexes = xAxisList.map(function (_axis, index) {
                    return index;
                });
                const existingDataZoom = Array.isArray(enhancedOption.dataZoom) ? enhancedOption.dataZoom : (enhancedOption.dataZoom ? [enhancedOption.dataZoom] : []);
                const hasInsideZoom = existingDataZoom.some(function (zoom) {
                    return zoom && String(zoom.type || "").toLowerCase() === "inside";
                });
                const hasSliderZoom = existingDataZoom.some(function (zoom) {
                    return zoom && String(zoom.type || "").toLowerCase() === "slider";
                });
                const dataZoom = existingDataZoom.slice();

                if (!hasInsideZoom) {
                    dataZoom.push({
                        type: "inside",
                        xAxisIndex: xAxisIndexes,
                        start: 0,
                        end: 100,
                        filterMode: "filter",
                        zoomOnMouseWheel: true,
                        moveOnMouseMove: true,
                        moveOnMouseWheel: false,
                        throttle: 80,
                    });
                }

                if (!hasSliderZoom) {
                    dataZoom.push({
                        type: "slider",
                        xAxisIndex: xAxisIndexes,
                        start: 0,
                        end: 100,
                        filterMode: "filter",
                        bottom: 18,
                        height: 18,
                        showDataShadow: false,
                        showDetail: false,
                        brushSelect: false,
                        borderColor: "#cbd5e1",
                        fillerColor: "rgba(0, 84, 150, 0.16)",
                        handleSize: "90%",
                        handleStyle: {
                            color: "#005496",
                            borderColor: "#005496",
                        },
                        moveHandleStyle: {
                            color: "#005496",
                        },
                        textStyle: {
                            color: "#64748b",
                        },
                    });
                }

                enhancedOption.dataZoom = dataZoom;

                function expandHeatmapGridBottom(grid) {
                    if (!grid || typeof grid !== "object") {
                        return;
                    }
                    const currentBottom = typeof grid.bottom === "number" ? grid.bottom : Number.parseFloat(String(grid.bottom || ""));
                    if (!Number.isFinite(currentBottom) || currentBottom < 72) {
                        grid.bottom = 72;
                    }
                }

                if (Array.isArray(enhancedOption.grid)) {
                    enhancedOption.grid.forEach(expandHeatmapGridBottom);
                } else if (enhancedOption.grid && typeof enhancedOption.grid === "object") {
                    expandHeatmapGridBottom(enhancedOption.grid);
                } else {
                    enhancedOption.grid = { bottom: 72 };
                }
            }

            applyElectricityDeltaTooltip("electricityDailyTrend");
            applyElectricityDeltaTooltip("electricityAreaComparison");
            applyElectricityPeriodAreaDeltaTooltip();
            applyElectricityDailyTotalHeatmapTooltipAndZoom();

            if (!hasLineSeries) {
                return enhancedOption;
            }

            const xAxisList = Array.isArray(enhancedOption.xAxis) ? enhancedOption.xAxis : [enhancedOption.xAxis];
            const xAxisIndexes = xAxisList.map(function (_axis, index) {
                return index;
            });
            const legendList = Array.isArray(enhancedOption.legend) ? enhancedOption.legend : (enhancedOption.legend ? [enhancedOption.legend] : []);
            const hasBottomLegend = legendList.some(function (legend) {
                return legend && legend.bottom !== undefined && legend.top === undefined;
            });
            const sliderBottom = hasBottomLegend ? 26 : 4;
            const minGridBottom = hasBottomLegend ? 78 : 54;
            const existingDataZoom = Array.isArray(enhancedOption.dataZoom) ? enhancedOption.dataZoom : (enhancedOption.dataZoom ? [enhancedOption.dataZoom] : []);
            const hasInsideZoom = existingDataZoom.some(function (zoom) {
                return zoom && String(zoom.type || "").toLowerCase() === "inside";
            });
            const hasSliderZoom = existingDataZoom.some(function (zoom) {
                return zoom && String(zoom.type || "").toLowerCase() === "slider";
            });
            const dataZoom = existingDataZoom.slice();

            if (!hasInsideZoom) {
                dataZoom.push({
                    type: "inside",
                    xAxisIndex: xAxisIndexes,
                    start: 0,
                    end: 100,
                    filterMode: "filter",
                    zoomOnMouseWheel: true,
                    moveOnMouseMove: true,
                    moveOnMouseWheel: false,
                    throttle: 80,
                });
            }

            if (!hasSliderZoom) {
                dataZoom.push({
                    type: "slider",
                    xAxisIndex: xAxisIndexes,
                    start: 0,
                    end: 100,
                    filterMode: "filter",
                    bottom: sliderBottom,
                    height: 18,
                    showDataShadow: false,
                    showDetail: false,
                    brushSelect: false,
                    borderColor: "#cbd5e1",
                    fillerColor: "rgba(0, 84, 150, 0.16)",
                    handleSize: "90%",
                    handleStyle: {
                        color: "#005496",
                        borderColor: "#005496",
                    },
                    moveHandleStyle: {
                        color: "#005496",
                    },
                    textStyle: {
                        color: "#64748b",
                    },
                });
            }

            enhancedOption.dataZoom = dataZoom;

            function numericBottom(value) {
                if (typeof value === "number") {
                    return value;
                }
                if (typeof value === "string" && /^\d+(\.\d+)?(px)?$/.test(value.trim())) {
                    return Number.parseFloat(value);
                }
                return null;
            }

            function expandGridBottom(grid) {
                if (!grid || typeof grid !== "object") {
                    return;
                }
                const currentBottom = numericBottom(grid.bottom);
                if (currentBottom === null || currentBottom < minGridBottom) {
                    grid.bottom = minGridBottom;
                }
                if (grid.containLabel === undefined) {
                    grid.containLabel = true;
                }
            }

            if (Array.isArray(enhancedOption.grid)) {
                enhancedOption.grid.forEach(expandGridBottom);
            } else if (enhancedOption.grid && typeof enhancedOption.grid === "object") {
                expandGridBottom(enhancedOption.grid);
            } else {
                enhancedOption.grid = {
                    bottom: minGridBottom,
                    containLabel: true,
                };
            }

            const axisDateMode = String(chartContext.axisDateMode || chartContext.periodType || chartContext.period_type || "").toLowerCase();
            if (axisDateMode !== "monthly") {
                return enhancedOption;
            }

            function safeDateValue(value) {
                if (value === null || value === undefined) {
                    return null;
                }
                if (value instanceof Date) {
                    return Number.isNaN(value.getTime()) ? null : { date: value };
                }
                if (Array.isArray(value) && value.length) {
                    return safeDateValue(value[0]);
                }
                if (typeof value === "object") {
                    if (value.time !== undefined) {
                        const parsed = new Date(value.time);
                        return Number.isNaN(parsed.getTime()) ? null : { date: parsed };
                    }
                    if (value.date !== undefined) {
                        const parsed = new Date(value.date);
                        return Number.isNaN(parsed.getTime()) ? null : { date: parsed };
                    }
                }
                if (typeof value === "number") {
                    const parsed = new Date(value);
                    return Number.isNaN(parsed.getTime()) ? null : { date: parsed };
                }

                if (typeof value === "string") {
                    const trimmed = value.trim();
                    if (!trimmed) {
                        return null;
                    }

                    const monthDayMatch = trimmed.match(/^([a-z]{3,10})\s+(\d{1,2})\s*(?:\(\s*([a-z]{3,10})\s*\))?$/i);
                    if (monthDayMatch) {
                        const monthMap = {
                            jan: 0,
                            january: 0,
                            feb: 1,
                            february: 1,
                            mar: 2,
                            march: 2,
                            apr: 3,
                            april: 3,
                            may: 4,
                            jun: 5,
                            june: 5,
                            jul: 6,
                            july: 6,
                            aug: 7,
                            august: 7,
                            sep: 8,
                            sept: 8,
                            september: 8,
                            oct: 9,
                            october: 9,
                            nov: 10,
                            november: 10,
                            dec: 11,
                            december: 11,
                        };

                        const monthKey = monthDayMatch[1].toLowerCase();
                        const monthIndex = monthMap[monthKey];
                        const day = Number(monthDayMatch[2]);
                        if (!Number.isNaN(monthIndex) && !Number.isNaN(day)) {
                            const parsed = new Date(2000, monthIndex, day);
                            if (Number.isNaN(parsed.getTime())) {
                                return null;
                            }
                            if (monthDayMatch[3]) {
                                return {
                                    weekdayText: monthDayMatch[3],
                                    date: parsed,
                                };
                            }
                            return {
                                date: parsed,
                            };
                        }
                    }

                    const isoParts = trimmed.match(/^(\d{4})-(\d{2})-(\d{2})/);
                    if (isoParts) {
                        const year = Number(isoParts[1]);
                        const month = Number(isoParts[2]) - 1;
                        const day = Number(isoParts[3]);
                        if (!Number.isNaN(year) && !Number.isNaN(month) && !Number.isNaN(day)) {
                            const parsed = new Date(year, month, day);
                            return Number.isNaN(parsed.getTime()) ? null : { date: parsed };
                        }
                    }

                    const parsed = new Date(trimmed);
                    return Number.isNaN(parsed.getTime()) ? null : {
                        date: parsed,
                    };
                }

                return null;
            }

            function dateFromAxisIndex(index) {
                const periodStart = safeDateValue(chartContext.periodStartDate || chartContext.startDate || chartContext.start_date);
                const labelIndex = Number(index);
                if (!periodStart || !Number.isInteger(labelIndex) || labelIndex < 0) {
                    return null;
                }

                const dateValue = new Date(periodStart.date.getTime());
                dateValue.setDate(dateValue.getDate() + labelIndex);

                const periodEnd = safeDateValue(chartContext.periodEndDate || chartContext.endDate || chartContext.end_date);
                if (periodEnd && dateValue.getTime() > periodEnd.date.getTime()) {
                    return null;
                }

                return { date: dateValue };
            }

            function formatMonthDayWeekday(value, index) {
                const parsed = safeDateValue(value);
                const resolved = parsed || dateFromAxisIndex(index);
                if (!resolved) {
                    return value === null || value === undefined ? "" : String(value);
                }
                const dateValue = resolved.date;
                const weekday = resolved.weekdayText;
                return (
                    dateValue.toLocaleDateString("en-US", { month: "short" }) + " " +
                    dateValue.toLocaleDateString("en-US", { day: "2-digit" }) +
                    " (" + (weekday || dateValue.toLocaleDateString("en-US", { weekday: "short" })) + ")"
                );
            }

            function hasMonthDayValues(axis) {
                return Boolean(chartContext.periodStartDate || chartContext.startDate || chartContext.start_date) || collectAxisValues(axis).some(function (value) {
                    return safeDateValue(value) !== null;
                });
            }

            function collectAxisValues(axis) {
                if (axis && Array.isArray(axis.data) && axis.data.length) {
                    return axis.data.slice();
                }
                const collected = [];
                seriesList.forEach(function (series) {
                    if (!series || !Array.isArray(series.data)) {
                        return;
                    }
                    series.data.forEach(function (point) {
                        if (Array.isArray(point)) {
                            collected.push(point[0]);
                            return;
                        }
                        if (point && typeof point === "object" && point.value !== undefined) {
                            const pointValue = Array.isArray(point.value) ? point.value[0] : point.value;
                            collected.push(pointValue);
                        }
                    });
                });
                return collected;
            }

            function resolveAxisPointCount(axis) {
                if (axis && Array.isArray(axis.data) && axis.data.length) {
                    return axis.data.length;
                }

                return seriesList.reduce(function (maxCount, series) {
                    const count = series && Array.isArray(series.data) ? series.data.length : 0;
                    return Math.max(maxCount, count);
                }, 0);
            }

            function applyMonthlyAxisLabel(axis, width) {
                const total = Math.max(1, resolveAxisPointCount(axis));
                const containerWidth = Number(width) > 0 ? Number(width) : 1024;
                const forceFullLabels = String(chartContext.axisLabelDensity || "").toLowerCase() === "full";
                const visibleTarget = forceFullLabels ? total : Math.max(4, Math.floor(containerWidth / 110));
                const interval = Math.max(1, Math.ceil(total / visibleTarget));
                const nextAxisLabel = axis.axisLabel ? Object.assign({}, axis.axisLabel) : {};

                nextAxisLabel.interval = visibleTarget >= total
                    ? 0
                    : function (index) {
                        const labelIndex = Number(index);
                        if (!Number.isInteger(labelIndex)) {
                            return false;
                        }
                        return labelIndex === 0 || labelIndex === total - 1 || (labelIndex % interval) === 0;
                    };
                nextAxisLabel.rotate = forceFullLabels ? 32 : 0;
                nextAxisLabel.margin = forceFullLabels ? 12 : 6;
                nextAxisLabel.formatter = function (value, index) {
                    return formatMonthDayWeekday(value, index);
                };
                nextAxisLabel.hideOverlap = !forceFullLabels;
                axis.axisLabel = nextAxisLabel;
            }

            xAxisList.forEach(function (axis) {
                if (!axis || typeof axis !== "object") {
                    return;
                }
                const axisType = String(axis.type || "category").toLowerCase();
                if (axisType !== "time" && axisType !== "category") {
                    return;
                }
                if (!hasMonthDayValues(axis)) {
                    return;
                }
                applyMonthlyAxisLabel(axis, chartContext.width);
            });

            return enhancedOption;
        };
    </script>
</head>
{% set report_scope = 'daily' if period.type == 'daily' else 'periodic' %}
<body class="report-body report-family-{{ report_scope }} report-period-{{ period.type | default('unknown') }}">
    <div class="report-container report-container-{{ report_scope }}">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
