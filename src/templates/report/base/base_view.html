<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.report_title or "Energy Consumption Report" }}</title>

    <style>
        {% include "assets/vendor/bootstrap/bootstrap.min.css" %}
    </style>
    <style>
        {% include "assets/report.css" %}
    </style>
    {% if report_style_css %}
    <style>
        {{ report_style_css | safe }}
    </style>
    {% endif %}
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
    <script>
        if (!window.echarts) {
            {% include "assets/vendor/echarts/echarts.min.js" %}
        }
    </script>
    <script>
        (function () {
            if (!window.echarts) {
                return;
            }

            var reportChartThemeName = {{ (chart_theme_name or 'report_default') | tojson }};
            var reportChartTheme = {{ (chart_theme_json or '{}') | safe }};
            echarts.registerTheme(reportChartThemeName, reportChartTheme);
            window.REPORT_CHART_THEME_NAME = reportChartThemeName;
        })();
    </script>
    <script>
        window.__scheduleReportChartInit = function (initFn) {
            let attempts = 0;
            const maxAttempts = 18;

            function finalize() {
                window.setTimeout(function () {
                    window.dispatchEvent(new Event("resize"));
                }, 120);
                window.setTimeout(function () {
                    window.dispatchEvent(new Event("beforeprint"));
                }, 320);
            }

            function run() {
                attempts += 1;
                const ready = initFn();
                if (ready === false && attempts < maxAttempts) {
                    window.setTimeout(run, 140);
                    return;
                }
                finalize();
            }

            function schedule() {
                window.requestAnimationFrame(function () {
                    window.requestAnimationFrame(run);
                });
            }

            if (document.readyState === "loading") {
                window.addEventListener("load", schedule, { once: true });
            } else {
                schedule();
            }
        };

        window.__enhanceReportLineChartOption = function (option) {
            if (!option || typeof option !== "object") {
                return option;
            }

            const seriesList = Array.isArray(option.series) ? option.series : (option.series ? [option.series] : []);
            const hasLineSeries = seriesList.some(function (series) {
                return series && String(series.type || "").toLowerCase() === "line";
            });
            if (!hasLineSeries || !option.xAxis) {
                return option;
            }

            const xAxisList = Array.isArray(option.xAxis) ? option.xAxis : [option.xAxis];
            const xAxisIndexes = xAxisList.map(function (_axis, index) {
                return index;
            });
            const legendList = Array.isArray(option.legend) ? option.legend : (option.legend ? [option.legend] : []);
            const hasBottomLegend = legendList.some(function (legend) {
                return legend && legend.bottom !== undefined && legend.top === undefined;
            });
            const sliderBottom = hasBottomLegend ? 26 : 4;
            const minGridBottom = hasBottomLegend ? 78 : 54;
            const existingDataZoom = Array.isArray(option.dataZoom) ? option.dataZoom : (option.dataZoom ? [option.dataZoom] : []);
            const hasInsideZoom = existingDataZoom.some(function (zoom) {
                return zoom && String(zoom.type || "").toLowerCase() === "inside";
            });
            const hasSliderZoom = existingDataZoom.some(function (zoom) {
                return zoom && String(zoom.type || "").toLowerCase() === "slider";
            });
            const dataZoom = existingDataZoom.slice();

            if (!hasInsideZoom) {
                dataZoom.push({
                    type: "inside",
                    xAxisIndex: xAxisIndexes,
                    start: 0,
                    end: 100,
                    filterMode: "filter",
                    zoomOnMouseWheel: true,
                    moveOnMouseMove: true,
                    moveOnMouseWheel: false,
                    throttle: 80,
                });
            }

            if (!hasSliderZoom) {
                dataZoom.push({
                    type: "slider",
                    xAxisIndex: xAxisIndexes,
                    start: 0,
                    end: 100,
                    filterMode: "filter",
                    bottom: sliderBottom,
                    height: 18,
                    showDataShadow: false,
                    showDetail: false,
                    brushSelect: false,
                    borderColor: "#cbd5e1",
                    fillerColor: "rgba(0, 84, 150, 0.16)",
                    handleSize: "90%",
                    handleStyle: {
                        color: "#005496",
                        borderColor: "#005496",
                    },
                    moveHandleStyle: {
                        color: "#005496",
                    },
                    textStyle: {
                        color: "#64748b",
                    },
                });
            }

            option.dataZoom = dataZoom;

            function numericBottom(value) {
                if (typeof value === "number") {
                    return value;
                }
                if (typeof value === "string" && /^\d+(\.\d+)?(px)?$/.test(value.trim())) {
                    return Number.parseFloat(value);
                }
                return null;
            }

            function expandGridBottom(grid) {
                if (!grid || typeof grid !== "object") {
                    return;
                }
                const currentBottom = numericBottom(grid.bottom);
                if (currentBottom === null || currentBottom < minGridBottom) {
                    grid.bottom = minGridBottom;
                }
                if (grid.containLabel === undefined) {
                    grid.containLabel = true;
                }
            }

            if (Array.isArray(option.grid)) {
                option.grid.forEach(expandGridBottom);
            } else if (option.grid && typeof option.grid === "object") {
                expandGridBottom(option.grid);
            } else {
                option.grid = {
                    bottom: minGridBottom,
                    containLabel: true,
                };
            }

            return option;
        };
    </script>
</head>
{% set report_scope = 'daily' if period.type == 'daily' else 'periodic' %}
<body class="report-body report-family-{{ report_scope }} report-period-{{ period.type | default('unknown') }}">
    <div class="report-container report-container-{{ report_scope }}">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
