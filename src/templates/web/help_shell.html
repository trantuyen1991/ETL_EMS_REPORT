<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or "Energy Report Help" }}</title>
    <style>
        :root {
            color-scheme: light;
            --help-bg: #f8fafc;
            --help-card: #ffffff;
            --help-border: #dbe4ee;
            --help-border-strong: #cbd5e1;
            --help-text: #0f172a;
            --help-muted: #475569;
            --help-primary: #005496;
            --help-primary-strong: #003f72;
            --help-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: var(--help-bg);
            color: var(--help-text);
        }

        .help-shell {
            min-height: 100vh;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            max-width: 1480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 16px;
            overflow: hidden;
        }

        .help-toolbar {
            background: var(--help-card);
            border: 1px solid var(--help-border);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: var(--help-shadow);
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            flex: 0 0 auto;
        }

        .help-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .help-subtitle {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--help-muted);
            line-height: 1.45;
        }

        .help-actions {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            flex: 0 0 auto;
        }

        .help-actions a {
            min-height: 40px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 0 14px;
            font-size: 14px;
            white-space: nowrap;
            border: 1px solid transparent;
            transition: all 0.18s ease;
        }

        .help-actions .is-primary {
            background: var(--help-primary);
            color: #ffffff;
        }

        .help-actions .is-primary:hover {
            background: var(--help-primary-strong);
        }

        .help-actions .is-secondary {
            background: #ffffff;
            color: var(--help-text);
            border-color: var(--help-border-strong);
        }

        .help-actions .is-secondary:hover {
            background: #f8fafc;
        }

        .help-panel {
            flex: 1 1 auto;
            min-height: 0;
            background: var(--help-card);
            border: 1px solid var(--help-border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--help-shadow);
        }

        .help-frame {
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }

        .help-alert {
            max-width: 760px;
            margin: 18px auto;
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #9a3412;
            border-radius: 16px;
            padding: 16px 18px;
        }

        .help-alert h2 {
            margin: 0 0 6px;
            font-size: 16px;
        }

        .help-alert p {
            margin: 0;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 760px) {
            .help-shell {
                padding: 10px;
            }

            .help-toolbar {
                align-items: stretch;
                flex-direction: column;
                border-radius: 16px;
                padding: 12px;
            }

            .help-title {
                font-size: 18px;
            }

            .help-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .help-actions a {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="help-shell">
        <section class="help-toolbar">
            <div>
                <h1 class="help-title">Energy Report Help</h1>
                <p class="help-subtitle">
                    Release-built PDF guide from the LaTeX documentation source.
                </p>
            </div>
            <div class="help-actions">
                <a class="is-secondary" href="/reports">Back to Reports</a>
                <a class="is-primary" href="{{ help_download_url }}">Download PDF</a>
            </div>
        </section>

        <section class="help-panel">
            {% if help_pdf_available %}
            <iframe
                class="help-frame"
                src="{{ help_pdf_url }}"
                title="Energy report help PDF"
            ></iframe>
            {% else %}
            <div class="help-alert" role="alert">
                <h2>Help PDF unavailable</h2>
                <p>{{ help_error_message }}</p>
            </div>
            {% endif %}
        </section>
    </div>
</body>
</html>
